version: 2

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}

release:
  draft: true

archives:
  - id: tar
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
  - id: binary
    formats:
      - binary
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

homebrew_casks:
  - ids:
      - tar
    repository:
      owner: pivovarit
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    description: "Minimalistic TUI for Docker"
    homepage: "https://github.com/pivovarit/tdocker"
    hooks:
      post:
        install: |
          system "/usr/bin/xattr", "-dr", "com.apple.quarantine", "{{ printf "{{ %q }}" "{{staged_path}}" }}/tdocker"

nfpms:
  - maintainer: Grzegorz Piwowarek <gpiwowarek@gmail.com>
    description: "Minimalistic TUI for Docker"
    homepage: "https://github.com/pivovarit/tdocker"
    license: "MIT"
    formats:
      - deb
      - rpm
      - apk
      - archlinux

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - Merge pull request
      - Merge branch
